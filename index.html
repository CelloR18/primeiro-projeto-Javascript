<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <title>Conversor DevClub</title>
</head>

<body>
    <img src="./assets/logo.gif" class="logo-gif">
    <main>
        <label class="primeira">
            Converter <b>de</b>
            <select>
                <option>R$ Real Brasileiro</option>
            </select>
        </label>
        <br>
        <label class="segunda">
            converter <b>para</b>
            <select class="seletor2">
                <option value="dolar">US$ Dolar Americano</option>
                <option value="euro">€ Euro</option>
                <option value="libra">£ Libra</option>
                <option value="iene"> ￥ iene</option>
            </select>
        </label>
        <br>
        <label class="terceira">
            Valor
            <input placeholder="R$ 10.000">
        </label>

        <button onclick="cliquei()" class="main-button">Converter</button>

        <section>
            <div class="currency-box">
                <img src="./assets/brasil 2.png" alt="Logo-real" class="brasil">
                <p  class="p1">Real</p>
                <p id="valor-real" class="p2">R$ 0,00</p>
                <br>
                <img src="./assets/Vector.png" class="seta">
                <br>
            </div>
            <div>
                <img src="./assets/estados-unidos (1) 1.png" class="eua">
                <p class="p1" id="moeda">Dolar</p>
                <p id="valor-dolar"  class="p2">US$ 0,00</p>
            </div>

        </section>
    </main>

</body>
<script src="./script.js"></script> 

</html>
